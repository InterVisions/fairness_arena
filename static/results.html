<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fairness Arena - Live Results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111827;
  color: #e5e7eb;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 28px 36px 60px;
}

h1  { color: #f9fafb; font-size: 22px; margin-bottom: 4px; }
.sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }

.card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 20px 24px 24px;
  margin-bottom: 22px;
  overflow-x: auto;
}

h2 {
  color: #d1d5db; font-size: 11px; font-weight: 600;
  margin: 0 0 14px;
  border-bottom: 1px solid #374151; padding-bottom: 6px;
  letter-spacing: .08em; text-transform: uppercase;
}

.status-row {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.pill { border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; }
.pill-votes   { background: #1e3a5f; color: #93c5fd; }
.pill-session { background: #064e3b; color: #6ee7b7; }
.pill-none    { background: #374151; color: #6b7280; }
.last-update  { font-size: 11px; color: #4b5563; margin-left: auto; }

/* ---- Table ---- */
table { border-collapse: collapse; table-layout: fixed; width: 100%; }

/* Sticky query label column */
.th-query-corner, .td-query {
  position: sticky; left: 0;
  background: #1f2937; z-index: 2;
  min-width: 160px; max-width: 160px;
}
.th-query-corner {
  z-index: 3; vertical-align: bottom;
  padding: 0 10px 8px 0;
  font-size: 11px; font-weight: 600; color: #6b7280;
  text-transform: uppercase; letter-spacing: .06em;
}
.td-query {
  font-size: 12px; font-weight: 600; color: #f9fafb;
  padding: 7px 12px 7px 0;
  vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Pair group header (row 1) */
.th-pair-group {
  text-align: center;
  padding: 5px 6px 4px;
  border-bottom: 1px solid #374151;
  border-left: 2px solid #4b5563;
}
.pair-top  { font-size: 11px; font-weight: 700; color: #93c5fd; white-space: nowrap; }
.pair-vs   { font-size: 10px; font-weight: 400; color: #f9fafb; white-space: nowrap; }
.pair-sub  { font-size: 11px; font-weight: 700; color: #fca5a5; white-space: nowrap; }

/* Session sub-header (row 2) */
.th-session {
  text-align: center;
  font-size: 10px; color: #9ca3af; font-weight: 500;
  padding: 3px 4px 6px;
  overflow: hidden;
  border-bottom: 2px solid #4b5563;
  width: 50px;
}
.th-session.first { border-left: 2px solid #4b5563; }
.th-session.all   { color: #6b7280; font-style: italic; }

/* Data cells */
.td-cell { padding: 4px 4px; vertical-align: middle; width: 50px; }
.td-cell.first { border-left: 2px solid #374151; }

/* Stacked bar */
.bar-outer {
  background: #111827; border-radius: 3px;
  overflow: hidden; height: 16px; display: flex; width: 100%;
}
.bar-a   { background: #2563eb; height: 100%; transition: width .3s; }
.bar-tie { background: #374151; height: 100%; transition: width .3s; }
.bar-b   { background: #dc2626; height: 100%; transition: width .3s; }

.pct-row {
  display: flex; justify-content: space-between;
  font-size: 9px; margin-top: 2px;
}
.pct-a { color: #93c5fd; font-weight: 600; }
.pct-b { color: #fca5a5; font-weight: 600; }
.pct-n { color: #4b5563; }

.cell-empty { text-align: center; color: #374151; font-size: 11px; padding: 4px 0; }

.legend {
  display: flex; gap: 18px; flex-wrap: wrap;
  margin-top: 16px; font-size: 12px; color: #9ca3af; align-items: center;
}
.legend-dot {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 2px; margin-right: 4px;
}

.no-data { text-align: center; color: #4b5563; padding: 40px; font-size: 14px; }

.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 2px solid #374151; border-top-color: #6b7280;
  border-radius: 50%; animation: spin .8s linear infinite;
  margin-right: 5px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

tbody tr:hover .td-cell  { background: #263345; }
tbody tr:hover .td-query { background: #1f2937; }
</style>
</head>
<body>

<h1>Fairness Arena - Live Results</h1>
<p class="sub">Which model in each pair is perceived as fairer, per query and per session.</p>

<div class="status-row">
  <span class="pill pill-votes"  id="pill-votes">-- votes</span>
  <span class="pill pill-none"   id="pill-session">No active session</span>
  <span class="last-update"      id="last-update"></span>
</div>

<div class="card">
  <h2>Pair preference by query and session</h2>
  <div id="main-wrap"><div class="no-data"><span class="spinner"></span>Loading...</div></div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#2563eb"></span>First model preferred</span>
    <span><span class="legend-dot" style="background:#374151"></span>Tie</span>
    <span><span class="legend-dot" style="background:#dc2626"></span>Second model preferred</span>
    <span style="color:#4b5563;font-size:11px">Blue = first model in pair header. n = votes in that cell.</span>
  </div>
</div>

<script>
const REFRESH_MS = 10000;

function miniBar(stats) {
  if (!stats) return '<div class="cell-empty">-</div>';
  const { n_a, n_b, n_tie } = stats;
  const n = n_a + n_b + n_tie;
  if (n === 0) return '<div class="cell-empty">-</div>';
  const pa = n_a / n, pb = n_b / n, pt = n_tie / n;
  return `
    <div class="bar-outer">
      <div class="bar-a"   style="width:${pa*100}%"></div>
      <div class="bar-tie" style="width:${pt*100}%"></div>
      <div class="bar-b"   style="width:${pb*100}%"></div>
    </div>
    <div class="pct-row">
      <span class="pct-a">${(pa*100).toFixed(0)}%</span>
      <span class="pct-n">n=${n}</span>
      <span class="pct-b">${(pb*100).toFixed(0)}%</span>
    </div>`;
}

function render(data) {
  document.getElementById('pill-votes').textContent = `${data.total_votes} votes`;

  const sp = document.getElementById('pill-session');
  if (data.active_session) {
    sp.textContent = `Active: ${data.active_session.name}`;
    sp.className = 'pill pill-session';
  } else {
    sp.textContent = 'No active session';
    sp.className = 'pill pill-none';
  }
  document.getElementById('last-update').textContent = `Updated ${new Date().toLocaleTimeString()}`;

  const { sessions, queries, pairs, model_names, data: cells, total_votes } = data;

  if (!total_votes || !queries.length || !pairs.length) {
    document.getElementById('main-wrap').innerHTML = '<div class="no-data">No votes yet</div>';
    return;
  }

  function label(modelId) {
    return model_names[modelId] || modelId;
  }

  const colsPerPair = sessions.length + 1; // +1 for All

  let html = '<table><thead>';

  // Row 1: sticky corner + pair group headers
  html += '<tr><th class="th-query-corner">Query</th>';
  pairs.forEach(pairKey => {
    const parts = pairKey.split(' vs ');
    const ma = parts[0], mb = parts.slice(1).join(' vs ');
    html += `<th class="th-pair-group" colspan="${colsPerPair}">
      <div class="pair-top">${label(ma)}</div>
      <div class="pair-vs">vs</div>
      <div class="pair-sub">${label(mb)}</div>
    </th>`;
  });
  html += '</tr>';

  // Row 2: blank corner + session sub-headers for each pair
  html += '<tr><th class="th-query-corner"></th>';
  pairs.forEach(() => {
    sessions.forEach((s, si) => {
      html += `<th class="th-session${si === 0 ? ' first' : ''}">${s.name}</th>`;
    });
    html += '<th class="th-session all">All</th>';
  });
  html += '</tr></thead><tbody>';

  // One row per query
  queries.forEach(q => {
    html += '<tr>';
    html += `<td class="td-query" title="${q}">${q}</td>`;

    pairs.forEach(pairKey => {
      const bySession = (cells[pairKey] || {})[q] || {};

      sessions.forEach((s, si) => {
        const stats = bySession[s.id] || null;
        html += `<td class="td-cell${si === 0 ? ' first' : ''}">${miniBar(stats)}</td>`;
      });

      // All aggregate (includes votes with no session)
      const agg = { n_a: 0, n_b: 0, n_tie: 0 };
      Object.values(bySession).forEach(s => { agg.n_a += s.n_a; agg.n_b += s.n_b; agg.n_tie += s.n_tie; });
      html += `<td class="td-cell">${miniBar(agg.n_a + agg.n_b + agg.n_tie > 0 ? agg : null)}</td>`;
    });

    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('main-wrap').innerHTML = html;
}

function fetchAll() {
  document.getElementById('last-update').innerHTML = '<span class="spinner"></span>Updating...';
  fetch('/api/live_results/full')
    .then(r => r.json())
    .then(render)
    .catch(err => {
      document.getElementById('last-update').textContent = 'Error: ' + err.message;
    })
    .finally(() => setTimeout(fetchAll, REFRESH_MS));
}

fetchAll();
</script>
</body>
</html>
